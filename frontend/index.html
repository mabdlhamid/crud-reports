<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laporan Magang</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #f4f5f7; color: #1f2937; }
  main { max-width: 720px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 1.5rem; margin: 0 0 16px; }
  h2 { font-size: 1.1rem; margin: 24px 0 8px; }
  section, .card { background: #fff; border-radius: 10px; padding: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .card { margin-bottom: 12px; }
  form { display: grid; gap: 10px; }
  label { display: grid; gap: 4px; font-size: .85rem; color: #4b5563; }
  input, textarea { font: inherit; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 6px; }
  textarea { min-height: 70px; resize: vertical; }
  button { font: inherit; padding: 8px 14px; border: 0; border-radius: 6px; background: #2563eb; color: #fff; cursor: pointer; }
  button:hover { background: #1d4ed8; }
  button.secondary { background: #e5e7eb; color: #1f2937; }
  button.danger { background: #dc2626; }
  button:disabled { opacity: .5; cursor: default; }
  .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
  .tabs button { background: #e5e7eb; color: #1f2937; }
  .tabs button.active { background: #2563eb; color: #fff; }
  .bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; align-items: end; }
  .msg { padding: 10px 12px; border-radius: 6px; margin: 0 0 12px; }
  .msg.err { background: #fee2e2; color: #991b1b; }
  .msg.ok { background: #dcfce7; color: #166534; }
  .card h3 { margin: 0 0 8px; font-size: 1rem; display: flex; justify-content: space-between; gap: 8px; }
  .card p { margin: 4px 0; white-space: pre-wrap; }
  .card .label { font-weight: 600; }
  .pager { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
  .muted { color: #6b7280; font-size: .9rem; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Laporan Magang Harian</h1>
  <p id="msg" class="msg" hidden></p>

  <!-- Belum login -->
  <section id="auth-section">
    <div class="tabs">
      <button id="tab-login" class="active" type="button">Login</button>
      <button id="tab-register" type="button">Register</button>
    </div>

    <form id="login-form">
      <label>Username <input name="username" autocomplete="username"></label>
      <label>Password <input name="password" type="password" autocomplete="current-password"></label>
      <button type="submit">Login</button>
    </form>

    <form id="register-form" hidden>
      <label>Nama <input name="name"></label>
      <label>Username <input name="username" autocomplete="username"></label>
      <label>Password (minimal 6 karakter) <input name="password" type="password" autocomplete="new-password"></label>
      <button type="submit">Register</button>
    </form>
  </section>

  <!-- Sudah login -->
  <div id="app-section" hidden>
    <div class="bar">
      <span id="whoami"></span>
      <button id="logout" class="secondary" type="button">Logout</button>
    </div>

    <h2>Buat Laporan</h2>
    <section>
      <form id="report-form">
        <label>Tanggal (kosongkan untuk hari ini) <input name="date" type="date"></label>
        <label>Problem <textarea name="problem"></textarea></label>
        <label>Solving <textarea name="solving"></textarea></label>
        <label>Kendala (opsional) <textarea name="kendala"></textarea></label>
        <label>Saran (opsional) <textarea name="saran"></textarea></label>
        <button type="submit">Simpan Laporan</button>
      </form>
    </section>

    <h2>Daftar Laporan</h2>
    <form id="filter-form" class="row">
      <label>Dari <input id="from" type="date"></label>
      <label>Sampai <input id="to" type="date"></label>
      <button type="submit">Filter</button>
    </form>
    <div id="list" style="margin-top: 12px;"></div>
    <div class="pager">
      <button id="prev" class="secondary" type="button">Sebelumnya</button>
      <span id="page-info" class="muted"></span>
      <button id="next" class="secondary" type="button">Berikutnya</button>
    </div>
  </div>
</main>

<script>
  // Alamat backend. Ubah kalau port atau alamatnya berbeda.
  const API_URL = "http://localhost:3000";

  const $ = (id) => document.getElementById(id);
  let page = 1;
  let totalPages = 1;

  // ---------- Pesan ----------
  function showMsg(text, ok = false) {
    const el = $("msg");
    el.textContent = text;           // textContent: aman dari XSS
    el.className = "msg " + (ok ? "ok" : "err");
    el.hidden = false;
  }
  function clearMsg() { $("msg").hidden = true; }

  // ---------- Fungsi pemanggil API ----------
  // Menambahkan header JSON dan token (kalau ada), lalu mengubah balasan jadi objek.
  async function api(path, options = {}) {
    const token = localStorage.getItem("token");
    const res = await fetch(API_URL + path, {
      ...options,
      headers: {
        "Content-Type": "application/json",
        ...(token ? { Authorization: "Bearer " + token } : {}),
      },
    });

    const data = await res.json().catch(() => ({}));

    if (!res.ok) {
      // token kedaluwarsa atau tidak valid -> paksa login ulang
      if (res.status === 401 && token) logout("Sesi habis, silakan login lagi");
      throw new Error(data.message || "Terjadi kesalahan");
    }
    return data;
  }

  // Ubah isi form jadi objek, buang kolom yang kosong
  function formToObject(form) {
    const obj = {};
    for (const [key, value] of new FormData(form)) {
      if (value.trim() !== "") obj[key] = value.trim();
    }
    return obj;
  }

  // ---------- Tampilan login / aplikasi ----------
  function render() {
    const loggedIn = !!localStorage.getItem("token");
    $("auth-section").hidden = loggedIn;
    $("app-section").hidden = !loggedIn;

    if (loggedIn) {
      const user = JSON.parse(localStorage.getItem("user") || "{}");
      $("whoami").textContent = "Halo, " + (user.name || user.username);
      page = 1;
      loadReports();
    }
  }

  function logout(message) {
    localStorage.removeItem("token");
    localStorage.removeItem("user");
    render();
    if (message) showMsg(message);
  }

  // ---------- Tab login / register ----------
  function showTab(name) {
    $("login-form").hidden = name !== "login";
    $("register-form").hidden = name !== "register";
    $("tab-login").classList.toggle("active", name === "login");
    $("tab-register").classList.toggle("active", name === "register");
    clearMsg();
  }
  $("tab-login").addEventListener("click", () => showTab("login"));
  $("tab-register").addEventListener("click", () => showTab("register"));

  // ---------- Register ----------
  $("register-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    clearMsg();
    try {
      await api("/register", { method: "POST", body: JSON.stringify(formToObject(e.target)) });
      e.target.reset();
      showTab("login");
      showMsg("Register berhasil, silakan login", true);
    } catch (err) {
      showMsg(err.message);
    }
  });

  // ---------- Login ----------
  $("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    clearMsg();
    try {
      const user = await api("/login", { method: "POST", body: JSON.stringify(formToObject(e.target)) });
      localStorage.setItem("token", user.token);
      localStorage.setItem("user", JSON.stringify({ id: user.id, username: user.username, name: user.name }));
      e.target.reset();
      render();
    } catch (err) {
      showMsg(err.message);
    }
  });

  $("logout").addEventListener("click", () => logout());

  // ---------- Buat laporan ----------
  $("report-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    clearMsg();
    try {
      await api("/reports", { method: "POST", body: JSON.stringify(formToObject(e.target)) });
      e.target.reset();
      showMsg("Laporan tersimpan", true);
      page = 1;
      loadReports();
    } catch (err) {
      showMsg(err.message);
    }
  });

  // ---------- Daftar laporan ----------
  function line(parent, label, text) {
    if (!text) return;
    const p = document.createElement("p");
    const b = document.createElement("span");
    b.className = "label";
    b.textContent = label + ": ";
    p.append(b, document.createTextNode(text));   // teks dari user tidak dibaca sebagai HTML
    parent.append(p);
  }

  async function loadReports() {
    try {
      const params = new URLSearchParams({ page, limit: 5 });
      if ($("from").value) params.set("from", $("from").value);
      if ($("to").value) params.set("to", $("to").value);

      const { data, meta } = await api("/reports?" + params);
      totalPages = meta.totalPages;

      const list = $("list");
      list.replaceChildren();

      if (data.length === 0) {
        const empty = document.createElement("p");
        empty.className = "muted";
        empty.textContent = "Belum ada laporan.";
        list.append(empty);
      }

      for (const r of data) {
        const card = document.createElement("div");
        card.className = "card";

        const title = document.createElement("h3");
        const date = document.createElement("span");
        date.textContent = r.date.slice(0, 10) + (r.user ? " - " + r.user.name : "");
        const del = document.createElement("button");
        del.className = "danger";
        del.textContent = "Hapus";
        del.addEventListener("click", () => removeReport(r.id));
        title.append(date, del);
        card.append(title);

        line(card, "Problem", r.problem);
        line(card, "Solving", r.solving);
        line(card, "Kendala", r.kendala);
        line(card, "Saran", r.saran);
        list.append(card);
      }

      $("page-info").textContent = meta.total === 0 ? "" : `Halaman ${meta.page} dari ${meta.totalPages}`;
      $("prev").disabled = page <= 1;
      $("next").disabled = page >= totalPages;
    } catch (err) {
      showMsg(err.message);
    }
  }

  async function removeReport(id) {
    if (!confirm("Hapus laporan ini?")) return;
    clearMsg();
    try {
      await api("/reports/" + id, { method: "DELETE" });
      showMsg("Laporan dihapus", true);
      loadReports();
    } catch (err) {
      showMsg(err.message);
    }
  }

  // ---------- Filter dan halaman ----------
  $("filter-form").addEventListener("submit", (e) => { e.preventDefault(); page = 1; loadReports(); });
  $("prev").addEventListener("click", () => { if (page > 1) { page--; loadReports(); } });
  $("next").addEventListener("click", () => { if (page < totalPages) { page++; loadReports(); } });

  // ---------- Mulai ----------
  render();
</script>
</body>
</html>
